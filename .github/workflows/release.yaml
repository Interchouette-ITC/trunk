# Rolling pre-release `trunk-itc-dev` of the Interchouette Trunk fork.
# Each push to main (or a manual run after an upstream sync) runs CI, builds the
# fork for the platforms Serenade supports, moves tag `trunk-itc-dev` to the commit
# and replaces the release assets, then verifies the published tag and assets.
# Serenade downloads these binaries; asset names are stable: trunk-<target>.tar.gz
# (trunk-<target>.zip on Windows), each with a matching .sha256 file. Every archive
# also gets a GitHub build-provenance attestation (Sigstore) signed by this workflow
# on main; Serenade refuses archives whose attestation does not verify.
name: Release trunk-itc-dev
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-trunk-itc-dev
  # Never cancel a release mid-way: that could leave the tag and assets out of sync.
  cancel-in-progress: false

env:
  RELEASE_TAG: trunk-itc-dev
  # rustls (ring): pure Rust TLS for static musl builds; no update check against upstream Trunk.
  FEATURES: --no-default-features --features rustls

jobs:
  ci:
    uses: ./.github/workflows/ci.yaml

  build:
    needs: ci
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            install: sudo apt-get update && sudo apt-get install -y musl-tools
          - target: x86_64-apple-darwin
            os: macos-26-intel
          - target: aarch64-apple-darwin
            os: macos-26
          - target: x86_64-pc-windows-msvc
            os: windows-2025
            ext: .exe
            archive: zip

    runs-on: ${{ matrix.os }}

    steps:
      - name: Setup | Checkout
        uses: actions/checkout@v7

      - name: Setup | Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: release-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Setup | Install dependencies
        if: matrix.install != ''
        run: ${{ matrix.install }}

      - name: Setup | Rust
        run: |
          rustup set auto-self-update disable
          rustup toolchain install stable --target ${{ matrix.target }} --profile minimal
          rustup default stable

      # Embedded by build.rs: `trunk --version` prints `trunk <version>+itc.<sha12>`.
      - name: Build | Build
        shell: bash
        run: |
          export TRUNK_BUILD_REVISION="${GITHUB_SHA::12}"
          cargo build --release --locked $FEATURES --target ${{ matrix.target }}

      - name: Post Build | Package
        shell: bash
        run: |
          set -euo pipefail
          BIN="trunk${{ matrix.ext }}"
          mkdir -p upload
          cp -pv "target/${{ matrix.target }}/release/${BIN}" "upload/${BIN}"
          if [[ "${{ matrix.ext }}" != ".exe" ]]; then
            strip "upload/${BIN}"
          fi
          VERSION="$("upload/${BIN}" --version)"
          echo "$VERSION"
          case "$VERSION" in "trunk "*"+itc.${GITHUB_SHA::12}") ;; *) echo "missing build revision"; exit 1 ;; esac
          # Windows ships as .zip, other targets as .tar.gz (Serenade picks the same format).
          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            (cd upload && 7z a -tzip "../trunk-${{ matrix.target }}.zip" "${BIN}")
          else
            tar -czvf "trunk-${{ matrix.target }}.tar.gz" -C upload "${BIN}"
          fi

      - name: Post Build | Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: trunk-${{ matrix.target }}
          path: trunk-${{ matrix.target }}.${{ matrix.archive || 'tar.gz' }}
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Setup | Checkout
        uses: actions/checkout@v7

      - name: Setup | Artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Setup | Checksums
        working-directory: dist
        run: |
          set -euo pipefail
          shopt -s nullglob
          for file in trunk-*.tar.gz trunk-*.zip; do
            sha256sum "$file" | awk '{print $1}' > "${file}.sha256"
          done
          ls -la

      # Attested before anything is published, so no asset is ever served without one.
      - name: Publish | Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/trunk-*.tar.gz
            dist/trunk-*.zip

      - name: Publish | Move trunk-itc-dev to this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          VERSION="$(tar -xzOf dist/trunk-x86_64-unknown-linux-musl.tar.gz trunk > "$RUNNER_TEMP/trunk" && chmod +x "$RUNNER_TEMP/trunk" && "$RUNNER_TEMP/trunk" --version)"
          NOTES="Interchouette fork of [Trunk](https://github.com/trunk-rs/trunk) (MIT/Apache-2.0), built from \`main\` @ \`${SHA}\` (\`${VERSION}\`).

          Rolling pre-release, moved on each push to \`main\`. Consumed by Serenade, which downloads \`trunk-<target>.tar.gz\` (\`trunk-<target>.zip\` on Windows) and verifies it against the matching \`.sha256\` file and its build provenance attestation (\`gh attestation verify <archive> --repo ${GH_REPO} --signer-workflow ${GH_REPO}/.github/workflows/release.yaml\`).

          Targets: \`x86_64-unknown-linux-musl\`, \`x86_64-apple-darwin\`, \`aarch64-apple-darwin\`, \`x86_64-pc-windows-msvc\`."

          git tag -f "$RELEASE_TAG" "$SHA"
          git push -f origin "refs/tags/${RELEASE_TAG}"

          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --prerelease --title "Trunk ITC dev" --notes "$NOTES"
          else
            gh release create "$RELEASE_TAG" --prerelease --title "Trunk ITC dev" --notes "$NOTES" --verify-tag
          fi

      - name: Publish | Replace assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" dist/* --clobber
          # Drop assets this build did not produce (e.g. a former Windows .tar.gz).
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | while read -r asset; do
            if [[ ! -f "dist/${asset}" ]]; then
              echo "Removing stale asset ${asset}"
              gh release delete-asset "$RELEASE_TAG" "$asset" --yes
            fi
          done

      # The tag is moved before the upload; fail the run unless the published tag and
      # every asset match this build, so a partial update is visible and re-runnable.
      - name: Verify | Published release matches this build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          TAGGED="$(git ls-remote origin "refs/tags/${RELEASE_TAG}" | awk '{print $1}')"
          [[ "$TAGGED" == "$SHA" ]] || { echo "tag ${RELEASE_TAG} is ${TAGGED:-missing}, expected ${SHA}"; exit 1; }

          EXPECTED=(
            trunk-x86_64-unknown-linux-musl.tar.gz
            trunk-x86_64-apple-darwin.tar.gz
            trunk-aarch64-apple-darwin.tar.gz
            trunk-x86_64-pc-windows-msvc.zip
          )
          PUBLISHED="$RUNNER_TEMP/published"
          rm -rf "$PUBLISHED"
          gh release download "$RELEASE_TAG" --dir "$PUBLISHED"
          ACTUAL_COUNT="$(find "$PUBLISHED" -type f | wc -l)"
          [[ "$ACTUAL_COUNT" -eq $(( ${#EXPECTED[@]} * 2 )) ]] || { echo "expected $(( ${#EXPECTED[@]} * 2 )) assets, found ${ACTUAL_COUNT}"; ls -la "$PUBLISHED"; exit 1; }

          for asset in "${EXPECTED[@]}"; do
            for file in "$asset" "$asset.sha256"; do
              [[ -f "$PUBLISHED/$file" ]] || { echo "missing asset $file"; exit 1; }
            done
            PUBLISHED_SUM="$(awk '{print $1}' "$PUBLISHED/$asset.sha256")"
            ACTUAL_SUM="$(sha256sum "$PUBLISHED/$asset" | awk '{print $1}')"
            BUILT_SUM="$(awk '{print $1}' "dist/$asset.sha256")"
            if [[ "$ACTUAL_SUM" != "$PUBLISHED_SUM" || "$ACTUAL_SUM" != "$BUILT_SUM" ]]; then
              echo "checksum mismatch for $asset (downloaded $ACTUAL_SUM, published $PUBLISHED_SUM, built $BUILT_SUM)"
              exit 1
            fi
            gh attestation verify "$PUBLISHED/$asset" \
              --repo "$GH_REPO" \
              --signer-workflow "${GH_REPO}/.github/workflows/release.yaml" \
              --source-ref refs/heads/main \
              --source-digest "$SHA" \
              --predicate-type https://slsa.dev/provenance/v1 > /dev/null
            echo "ok $asset $ACTUAL_SUM (provenance verified)"
          done
